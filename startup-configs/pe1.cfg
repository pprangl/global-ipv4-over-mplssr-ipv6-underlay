!
no enable password
no aaa root
aaa authentication policy local allow-nopassword-remote-login
!
username admin privilege 15 role network-admin nopassword
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname PE1
!
vrf instance MGMT
!
management api http-commands
   no shutdown
!
aaa authorization exec default local
!
management ssh
   shutdown
   !
   vrf MGMT
      no shutdown
!
interface Ethernet1
   description to_P1_eth1
   no switchport
   ipv6 address 2001:0:12:13::12/64
   isis enable CORE
   isis ipv6 metric 10
   isis multi-topology address-family ipv6 unicast
   no isis hello padding
   isis network point-to-point
!
interface Ethernet2
   description to_CE1_eth1
   no switchport
   ip address 10.11.12.12/24
!
interface Loopback0
   description Router-ID
   ip address 12.12.12.12/32
   ipv6 address 2002::12/128
   node-segment ipv6 index 612
   isis instance CORE
   isis ipv6 metric 10
   isis passive
!
ipv6 unicast-routing
ip routing
ip routing vrf MGMT
!
interface Management1
   vrf MGMT
   ip address 172.100.100.12/24
!
ip route vrf MGMT 0.0.0.0/0 172.100.100.1
!
mpls ip
!
mpls label range bgp-sr 20000 2000
mpls label range dynamic 362144 131072
mpls label range isis-sr 20000 3000
mpls label range ospf-sr 20000 2000
mpls label range static 80000 99984
!
router isis CORE
   net 49.0001.0000.0000.0012.00
   router-id ipv4 12.12.12.12
   is-type level-2
   timers local-convergence-delay protected-prefixes
   spf-interval 2 10 100
   timers lsp out-delay 2000
   !
   address-family ipv6 unicast
      maximum-paths 8
      multi-topology
      fast-reroute ti-lfa mode node-protection
   !
   segment-routing mpls
      no shutdown
   !
!
router bgp 65666
   router-id 12.12.12.12
   no bgp default ipv4-unicast
   graceful-restart restart-time 120
   graceful-restart
   maintenance receiver route-map default local-preference 20
   maximum-paths 8 ecmp 8
   no bgp bestpath as-path multipath-relax
   bgp bestpath tie-break router-id
   neighbor IBGP_CLIENT_PEER_V6 peer group
   neighbor IBGP_CLIENT_PEER_V6 remote-as 65666
   neighbor IBGP_CLIENT_PEER_V6 update-source Loopback0
   neighbor IBGP_CLIENT_PEER_V6 send-community standard extended large
   neighbor IBGP_CLIENT_PEER_V6 maximum-routes 0
   neighbor 10.11.12.11 remote-as 65123
   neighbor 10.11.12.11 send-community standard extended large
   neighbor 10.11.12.11 maximum-routes 0
   neighbor 2002::13 peer group IBGP_CLIENT_PEER_V6
   neighbor 2002::13 description P1_RR
   redistribute connected
   !
   address-family ipv4
      neighbor IBGP_CLIENT_PEER_V6 activate
      neighbor 10.11.12.11 activate
    !
!