---
name: globalIPv4overMPLSSRIPv6underlay
prefix: ""

mgmt:
  network: mgmt
  ipv4-subnet: 172.100.100.0/24

topology:

  defaults:
    kind: arista_ceos

  kinds:
    arista_ceos:
      image: arista/ceos:latest
      env:
        CLAB_MGMT_VRF: MGMT
        INTFTYPE: et
    linux:
      image: ghcr.io/aristanetworks/aclabs/host-ubuntu:rev1.7
  nodes:
    ce1:
      mgmt-ipv4: 172.100.100.11
      startup-config: startup-configs/ce1.cfg
      binds:
      - interface-maps/DCS-7280SR3K-48YC8_EosIntfMapping.json:/mnt/flash/EosIntfMapping.json:ro
    pe1:
      mgmt-ipv4: 172.100.100.12
      startup-config: startup-configs/pe1.cfg
      binds:
      - interface-maps/DCS-7280SR3K-48YC8_EosIntfMapping.json:/mnt/flash/EosIntfMapping.json:ro
    p1:
      mgmt-ipv4: 172.100.100.13
      startup-config: startup-configs/p1.cfg
      binds:
      - interface-maps/DCS-7280SR3K-48YC8_EosIntfMapping.json:/mnt/flash/EosIntfMapping.json:ro
    pe2:
      mgmt-ipv4: 172.100.100.14
      startup-config: startup-configs/pe2.cfg
      binds:
      - interface-maps/DCS-7280SR3K-48YC8_EosIntfMapping.json:/mnt/flash/EosIntfMapping.json:ro
    ce2:
      mgmt-ipv4: 172.100.100.15
      startup-config: startup-configs/ce2.cfg
      binds:
      - interface-maps/DCS-7280SR3K-48YC8_EosIntfMapping.json:/mnt/flash/EosIntfMapping.json:ro
  links:
  - endpoints:
    - ce1:eth1
    - pe1:eth2
  - endpoints:
    - pe1:eth1
    - p1:eth1
  - endpoints:
    - p1:eth2
    - pe2:eth1
  - endpoints:
    - pe2:eth2
    - ce2:eth1